quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=timetracker
quarkus.datasource.password=timetracker

# dev and prod use the Podman compose database; test has no URL so Dev Services starts a container
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/timetracker
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/timetracker

# schema is owned by Flyway, Hibernate must not touch it
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true

# tests: Dev Services starts this image via Testcontainers, same major version as compose.yaml
quarkus.datasource.devservices.image-name=docker.io/library/postgres:16

# OpenAPI document at /q/openapi, Swagger UI at /q/swagger-ui (also in the packaged app, not only in dev mode)
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Time Tracker API
quarkus.smallrye-openapi.info-version=1.0.0
